<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Not Found</title>
    <script>
      (function () {
        var path = window.location.pathname || '';
        if (path === '/RoundPipe' || path.startsWith('/RoundPipe/')) {
          var search = window.location.search || '';
          var hash = window.location.hash || '';
          var target = 'https://thustorage.github.io' + path + search + hash;
          window.location.replace(target);
        }
      })();
    </script>
  </head>
  <body>
    Page not found.
  </body>
</html>
